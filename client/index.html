<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#001b2b" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme, accent;
        try {
          theme = localStorage.getItem('theme');
          accent = localStorage.getItem('accent');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = accent || 'ember';
      })();
    </script>
    <meta name="description" content="Hasith Kenula — Full Stack Developer, UI/UX designer and IT undergraduate at SLIIT." />
